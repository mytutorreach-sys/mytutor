<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Lessons for Kids | Your Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3EA;
    --pink: #F6C6D1;
    --pink-dark: #E88FA3;
    --maroon: #7A3B45;
    --gold: #F4B942;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: 'Nunito', 'Trebuchet MS', sans-serif;
    color: var(--maroon);
    text-align: center;
    padding: 40px 20px 80px;
    overflow-x: hidden;
  }

  .logo {
    width: 180px;
    height: 180px;
    object-fit: contain;
    margin-bottom: 20px;
    animation: floaty 3.5s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  h1 {
    font-family: 'Baloo 2', 'Nunito', sans-serif;
    font-size: 2.1rem;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 1.15rem;
    color: var(--pink-dark);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .price-badge {
    display: inline-block;
    font-family: 'Baloo 2', sans-serif;
    background: var(--pink);
    color: var(--maroon);
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 20px;
    border: 2px solid var(--pink-dark);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    text-decoration: none;
    font-size: 1rem;
    line-height: 1.4;
  }

  .price-badge:hover {
    background: var(--pink-dark);
  }

  .price-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 15px 0 50px;
    flex-wrap: wrap;
  }

  .gallery {
    position: relative;
    max-width: 480px;
    margin: 0 auto 55px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .gallery-item {
    border-radius: 22px;
    overflow: hidden;
    position: relative;
  }

  .gallery-item:nth-child(1) { background: #C9AEE0; }
  .gallery-item:nth-child(2) { background: #C7E8C0; }
  .gallery-item:nth-child(3) { background: #F6D671; }
  .gallery-item:nth-child(4) { background: #F5AFC7; }

  .gallery-item img {
    width: 100%;
    height: auto;
    display: block;
  }

  .socials {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    justify-items: center;
    gap: 16px;
    max-width: 480px;
    margin: 0 auto 60px;
  }

  .social-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--maroon);
    background: var(--white);
    border: 2px solid var(--pink-dark);
    border-radius: 50px;
    padding: 12px 16px;
    width: 100%;
    max-width: 220px;
    min-width: 0;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .social-btn:hover {
    transform: translateY(-3px) scale(1.02);
    background: var(--pink);
  }

  .icon-badge {
    width: 46px;
    height: 46px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 2.5px solid var(--maroon);
  }

  .icon-badge svg {
    width: 26px;
    height: 26px;
  }

  .icon-badge.instagram { background: #F0C8DA; border-radius: 16px; }
  .icon-badge.facebook  { background: #B7DCD8; border-radius: 16px; }
  .icon-badge.tiktok    { background: #F0B8C4; border-radius: 50%; }
  .icon-badge.gmail     { background: #F6E2A4; border-radius: 50%; }

  .social-btn span {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .contact-section {
    max-width: 420px;
    margin: 0 auto;
    background: var(--white);
    border-radius: 24px;
    padding: 30px 25px;
    border: 2px solid var(--pink);
  }

  .contact-section h2 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.4rem;
    margin-bottom: 8px;
  }

  .contact-section p {
    font-size: 0.9rem;
    color: var(--pink-dark);
    margin-bottom: 20px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }

  label {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: -8px;
  }

  input, textarea {
    padding: 10px 14px;
    border-radius: 12px;
    border: 2px solid var(--pink);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
  }

  input:focus, textarea:focus {
    border-color: var(--pink-dark);
  }

  textarea { resize: vertical; min-height: 90px; }

  button.submit-btn {
    margin-top: 6px;
    background: var(--gold);
    color: var(--maroon);
    border: none;
    padding: 12px;
    border-radius: 14px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
    transition: background 0.2s ease;
    width: 100%;
  }

  button.submit-btn:hover { background: #e0a92f; }

  .form-note {
    font-size: 0.75rem;
    color: #b98a95;
    margin-top: 10px;
  }

  footer {
    margin-top: 50px;
    font-size: 0.8rem;
    color: var(--pink-dark);
  }

  /* ---------- Carousel ---------- */
  .carousel-section {
    margin: 10px 0 55px;
  }

  .carousel-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .carousel {
    position: relative;
    max-width: 480px;
    height: 320px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: pan-y;
  }

  .carousel-track {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .carousel-slide {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 230px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(122,59,69,0.22);
    border: 4px solid var(--white);
    transition: transform 0.45s ease, opacity 0.45s ease, filter 0.45s ease;
    cursor: pointer;
  }

  .carousel-slide img {
    width: 100%;
    display: block;
  }

  .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--white);
    border: 2px solid var(--pink-dark);
    color: var(--maroon);
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    user-select: none;
  }

  .carousel-arrow.prev { left: 0; }
  .carousel-arrow.next { right: 0; }

  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }

  .carousel-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--pink);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .carousel-dot.active {
    background: var(--pink-dark);
    transform: scale(1.3);
  }

  /* ---------- Plan info modal ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(122,59,69,0.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-box {
    background: var(--white);
    border-radius: 22px;
    border: 2px solid var(--pink);
    max-width: 340px;
    width: 100%;
    padding: 26px 24px;
    text-align: left;
    position: relative;
  }

  .modal-box h3 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.2rem;
    margin-bottom: 10px;
    color: var(--maroon);
  }

  .modal-box p {
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--maroon);
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--pink-dark);
    cursor: pointer;
    line-height: 1;
  }
</style>
</head>
<body>

  <img src="logo.png" alt="Tutor mascot logo" class="logo">
  <h1>Hi, I'm Your English Tutor! 👋</h1>
  <p class="subtitle">Fun English lessons for kids</p>
  <div class="price-row">
    <a class="price-badge" href="mailto:mytutor.reach@gmail.com?subject=Free%20Trial%20Lesson%20Request&body=Hi!%20I'd%20love%20to%20book%20a%20free%20trial%20lesson.%20Please%20let%20me%20know%20your%20available%20times.%20Thank%20you!">Free Trial</a>
    <button type="button" class="price-badge" data-title="Paired Lesson (2 Students)" data-desc="Your child learns alongside one other student in a small, focused 1-on-2 setting. It's a great way to build confidence through friendly interaction while still getting plenty of individual attention from the tutor.">$4.21 per lesson</button>
    <button type="button" class="price-badge" data-title="Private 1-on-1 Lesson" data-desc="A fully personalized session with just your child and the tutor. Lessons are tailored entirely to their pace, interests, and learning goals — ideal for focused, faster progress.">$8.41 per lesson</button>
  </div>

  <div class="gallery">
    <div class="gallery-item"><img src="gallery/card-pronunciation.png" alt="Pronunciation correction"></div>
    <div class="gallery-item"><img src="gallery/card-vocabulary.png" alt="Vocabulary"></div>
    <div class="gallery-item"><img src="gallery/card-readfind.png" alt="Read and find"></div>
    <div class="gallery-item"><img src="gallery/card-personalized.png" alt="Personalized lessons"></div>
  </div>

  <div class="carousel-section">
    <div class="carousel-title">See What We Offer</div>
    <div class="carousel">
      <div class="carousel-arrow prev" id="carPrev">&#10094;</div>
      <div class="carousel-track" id="carTrack">
        <div class="carousel-slide"><img src="carousel/post1.png" alt="Now open for bookings"></div>
        <div class="carousel-slide"><img src="carousel/post2.png" alt="Meet your teacher"></div>
        <div class="carousel-slide"><img src="carousel/post3.png" alt="Why learn with me"></div>
        <div class="carousel-slide"><img src="carousel/post4.png" alt="What your child will learn"></div>
        <div class="carousel-slide"><img src="carousel/post5.png" alt="Testimonial"></div>
        <div class="carousel-slide"><img src="carousel/post6.png" alt="Spots are open"></div>
      </div>
      <div class="carousel-arrow next" id="carNext">&#10095;</div>
    </div>
    <div class="carousel-dots" id="carDots"></div>
  </div>

  <div class="socials">
    <a class="social-btn" href="https://www.instagram.com/myttutor?igsh=MXVmYmpvNGdxZ21rcA==" target="_blank" rel="noopener">
      <div class="icon-badge instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7A3B45" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="17.2" cy="6.8" r="0.9" fill="#7A3B45" stroke="none"/>
        </svg>
      </div>
      <span>Instagram</span>
    </a>
    <a class="social-btn" href="https://www.facebook.com/share/18hxcDXV69/" target="_blank" rel="noopener">
      <div class="icon-badge facebook">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7A3B45" stroke-width="1.8">
          <path d="M14 8.5h2.2V5.3h-2.5c-2.3 0-3.7 1.5-3.7 3.9v1.9H7.6v3.2H10v6.4h3.1v-6.4h2.5l.5-3.2h-3v-1.6c0-.7.3-1 1-1z"/>
        </svg>
      </div>
      <span>Facebook</span>
    </a>
    <a class="social-btn" href="https://www.tiktok.com/@asyatutorr?_r=1&_t=ZS-98XxhA0dU3M" target="_blank" rel="noopener">
      <div class="icon-badge tiktok">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7A3B45" stroke-width="1.8">
          <path d="M13 3.5c.4 2 1.9 3.4 4 3.6v2.4c-1.4 0-2.8-.4-4-1.2v6.1a5 5 0 1 1-4.3-4.9v2.5a2.5 2.5 0 1 0 1.8 2.4V3.5z"/>
        </svg>
      </div>
      <span>TikTok</span>
    </a>
    <a class="social-btn" href="#contact">
      <div class="icon-badge gmail">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7A3B45" stroke-width="1.8">
          <rect x="3" y="5.5" width="18" height="13" rx="2.5"/>
          <path d="M4 6.5l8 6.5 8-6.5"/>
        </svg>
      </div>
      <span>Gmail</span>
    </a>
  </div>

  <div class="contact-section" id="contact">
    <h2>Get in Touch</h2>
    <p>Send a message and I'll reply by email 🩷</p>
    <form action="https://formsubmit.co/mytutor.reach@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New message from your tutoring website!">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="text" name="_honey" style="display:none">

      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell me about your child's lessons..." required></textarea>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>
    <p class="form-note">Messages are sent directly to mytutor.reach@gmail.com</p>
  </div>

  <footer>
    Made with 🩷 for young English learners
  </footer>

  <!-- Plan info modal -->
  <div class="modal-overlay" id="planModal">
    <div class="modal-box">
      <button class="modal-close" id="planModalClose" aria-label="Close">&times;</button>
      <h3 id="planModalTitle"></h3>
      <p id="planModalDesc"></p>
    </div>
  </div>

  <script>
    (function () {
      const track = document.getElementById('carTrack');
      const slides = Array.from(track.children);
      const dotsWrap = document.getElementById('carDots');
      const prevBtn = document.getElementById('carPrev');
      const nextBtn = document.getElementById('carNext');
      let current = 0;

      slides.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => goTo(i));
        dotsWrap.appendChild(dot);
      });
      const dots = Array.from(dotsWrap.children);

      function render() {
        const n = slides.length;
        slides.forEach((slide, i) => {
          let offset = i - current;
          if (offset > n / 2) offset -= n;
          if (offset < -n / 2) offset += n;

          const abs = Math.abs(offset);
          let tx = offset * 130;
          let scale = 1 - abs * 0.18;
          let opacity = 1 - abs * 0.35;
          let z = 10 - abs;

          if (abs > 2) { opacity = 0; }

          slide.style.transform = `translate(-50%, -50%) translateX(${tx}px) scale(${scale})`;
          slide.style.opacity = opacity;
          slide.style.zIndex = z;
        });
        dots.forEach((d, i) => d.classList.toggle('active', i === current));
      }

      function goTo(i) {
        const n = slides.length;
        current = ((i % n) + n) % n;
        render();
      }

      prevBtn.addEventListener('click', () => goTo(current - 1));
      nextBtn.addEventListener('click', () => goTo(current + 1));
      slides.forEach((slide, i) => slide.addEventListener('click', () => goTo(i)));

      // touch swipe support
      let startX = 0;
      const carousel = track.parentElement;
      carousel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      carousel.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        if (dx > 40) goTo(current - 1);
        else if (dx < -40) goTo(current + 1);
      }, { passive: true });

      render();
    })();

    (function () {
      const modal = document.getElementById('planModal');
      const modalTitle = document.getElementById('planModalTitle');
      const modalDesc = document.getElementById('planModalDesc');
      const closeBtn = document.getElementById('planModalClose');
      const badges = document.querySelectorAll('button.price-badge');

      badges.forEach(badge => {
        badge.addEventListener('click', () => {
          const title = badge.getAttribute('data-title');
          modalTitle.textContent = title;
          modalDesc.textContent = badge.getAttribute('data-desc');
          modal.classList.add('open');
        });
      });

      function closeModal() {
        modal.classList.remove('open');
      }

      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
    })();
  </script>

</body>
</html>
