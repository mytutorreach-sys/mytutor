<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ra Tutor | Fun English Lessons for Kids</title>
<meta name="description" content="Fun, friendly English lessons for kids with Ra Tutor. Book a free trial lesson today.">
<meta property="og:type" content="website">
<meta property="og:title" content="Ra Tutor | Fun English Lessons for Kids">
<meta property="og:description" content="Fun, friendly English lessons for kids. Book a free trial lesson today.">
<meta property="og:image" content="https://mytutorreach-sys.github.io/mytutor/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3EA;
    --pink: #F6C6D1;
    --pink-dark: #E88FA3;
    --maroon: #7A3B45;
    --gold: #F4B942;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: 'Nunito', 'Trebuchet MS', sans-serif;
    color: var(--maroon);
    text-align: center;
    padding: 40px 20px 80px;
    overflow-x: hidden;
  }

  .logo {
    width: 180px;
    height: 180px;
    object-fit: contain;
    margin-bottom: 20px;
    animation: floaty 3.5s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  h1 {
    font-family: 'Baloo 2', 'Nunito', sans-serif;
    font-size: 2.1rem;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 1.15rem;
    color: var(--pink-dark);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .price-badge {
    display: inline-block;
    font-family: 'Baloo 2', sans-serif;
    background: var(--pink);
    color: var(--maroon);
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 20px;
    border: 2px solid var(--pink-dark);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    text-decoration: none;
    font-size: 1rem;
    line-height: 1.4;
  }

  .price-badge:hover {
    background: var(--pink-dark);
  }

  .price-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 15px 0 50px;
    flex-wrap: wrap;
  }

  .gallery {
    position: relative;
    max-width: 480px;
    margin: 0 auto 55px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .gallery-item {
    border-radius: 22px;
    overflow: hidden;
    position: relative;
  }

  .gallery-item:nth-child(1) { background: #C9AEE0; }
  .gallery-item:nth-child(2) { background: #C7E8C0; }
  .gallery-item:nth-child(3) { background: #F6D671; }
  .gallery-item:nth-child(4) { background: #F5AFC7; }

  .gallery-item img {
    width: 100%;
    height: auto;
    display: block;
  }

  .socials {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    justify-items: center;
    gap: 16px;
    max-width: 480px;
    margin: 0 auto 60px;
  }

  .social-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--maroon);
    background: var(--white);
    border: 2px solid var(--pink-dark);
    border-radius: 50px;
    padding: 12px 16px;
    width: 100%;
    max-width: 220px;
    min-width: 0;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .social-btn:hover {
    transform: translateY(-3px) scale(1.02);
    background: var(--pink);
  }

  .icon-badge {
    width: 46px;
    height: 46px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 2.5px solid var(--maroon);
  }

  .icon-badge svg {
    width: 26px;
    height: 26px;
  }

  .icon-badge.instagram { background: #F0C8DA; border-radius: 16px; }
  .icon-badge.facebook  { background: #B7DCD8; border-radius: 16px; }
  .icon-badge.tiktok    { background: #F0B8C4; border-radius: 50%; }
  .icon-badge.gmail     { background: #F6E2A4; border-radius: 50%; }

  .social-btn span {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .contact-section {
    max-width: 420px;
    margin: 0 auto;
    background: var(--white);
    border-radius: 24px;
    padding: 30px 25px;
    border: 2px solid var(--pink);
  }

  .contact-section h2 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.4rem;
    margin-bottom: 8px;
  }

  .contact-section p {
    font-size: 0.9rem;
    color: var(--pink-dark);
    margin-bottom: 20px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }

  label {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: -8px;
  }

  input, textarea {
    padding: 10px 14px;
    border-radius: 12px;
    border: 2px solid var(--pink);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
  }

  input:focus, textarea:focus {
    border-color: var(--pink-dark);
  }

  textarea { resize: vertical; min-height: 90px; }

  button.submit-btn {
    margin-top: 6px;
    background: var(--gold);
    color: var(--maroon);
    border: none;
    padding: 12px;
    border-radius: 14px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
    transition: background 0.2s ease;
    width: 100%;
  }

  button.submit-btn:hover { background: #e0a92f; }

  .form-note {
    font-size: 0.75rem;
    color: #b98a95;
    margin-top: 10px;
  }

  footer {
    margin-top: 50px;
    font-size: 0.8rem;
    color: var(--pink-dark);
  }

  /* ---------- Carousel ---------- */
  .carousel-section {
    margin: 10px 0 55px;
  }

  .carousel-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .carousel {
    position: relative;
    max-width: 480px;
    height: 320px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: pan-y;
  }

  .carousel-track {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .carousel-slide {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 230px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(122,59,69,0.22);
    border: 4px solid var(--white);
    transition: transform 0.45s ease, opacity 0.45s ease, filter 0.45s ease;
    cursor: pointer;
  }

  .carousel-slide img {
    width: 100%;
    display: block;
  }



  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }

  .carousel-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--pink);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .carousel-dot.active {
    background: var(--pink-dark);
    transform: scale(1.3);
  }

  /* ---------- Plan info modal ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(122,59,69,0.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-box {
    background: var(--white);
    border-radius: 22px;
    border: 2px solid var(--pink);
    max-width: 340px;
    width: 100%;
    padding: 26px 24px;
    text-align: left;
    position: relative;
  }

  .modal-box h3 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.2rem;
    margin-bottom: 10px;
    color: var(--maroon);
  }

  .modal-box p {
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--maroon);
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--pink-dark);
    cursor: pointer;
    line-height: 1;
  }

  /* ---------- Arabic / RTL ---------- */
  body.rtl,
  body.rtl h1,
  body.rtl .subtitle,
  body.rtl .price-badge,
  body.rtl .carousel-title,
  body.rtl .contact-section h2,
  body.rtl .social-btn span,
  body.rtl button.submit-btn,
  body.rtl .modal-box h3 {
    font-family: 'Cairo', 'Nunito', sans-serif;
  }

  body.rtl form {
    text-align: right;
  }

  body.rtl .modal-box {
    text-align: right;
  }

  body.rtl .modal-close {
    right: auto;
    left: 14px;
  }

  .lang-toggle {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 50;
  }

  body.rtl .lang-toggle {
    left: auto;
    right: 16px;
  }

  /* ---------- Learn & Play ---------- */
  .play-section{max-width:480px;margin:0 auto 55px}
  .play-card{background:var(--white);border:2px solid var(--pink);border-radius:24px;padding:24px 20px;margin-bottom:26px}
  .play-card h2{font-family:'Baloo 2',sans-serif;font-size:1.4rem;margin-bottom:6px}
  .play-card .hint{font-size:.9rem;color:var(--pink-dark);margin-bottom:14px}
  .btn-soft{font-family:'Baloo 2',sans-serif;font-weight:700;background:var(--gold);color:var(--maroon);border:none;border-radius:14px;padding:10px 18px;font-size:1rem;cursor:pointer;margin:4px}
  .btn-soft:hover{background:#e0a92f}
  .btn-soft.alt{background:var(--pink);border:2px solid var(--pink-dark)}
  .quiz-opt{display:block;width:100%;margin:8px 0;padding:11px 14px;border-radius:14px;border:2px solid var(--pink);background:var(--white);color:var(--maroon);font-family:inherit;font-size:1rem;cursor:pointer;text-align:left}
  body.rtl .quiz-opt{text-align:right}
  .quiz-opt:hover{border-color:var(--pink-dark);background:var(--cream)}
  .quiz-opt.right{background:#C7E8C0;border-color:#7bbf72}
  .quiz-opt.wrong{background:#F5C6C6;border-color:#d98c8c}
  .quiz-q{font-size:1.2rem;font-weight:700;margin:6px 0 2px}
  .quiz-hint,.quiz-step{font-size:.85rem;color:var(--pink-dark)}
  .quiz-result{font-family:'Baloo 2',sans-serif;font-size:1.5rem;margin:8px 0;min-height:1.5em}
  .quiz-name{width:100%;margin:8px 0}
  .confetti{position:fixed;top:-30px;font-size:1.6rem;z-index:200;pointer-events:none;animation:fall 2.4s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  .socials.after-contact{margin:30px auto 0}

  .lang-switch{position:fixed;top:16px;left:16px;z-index:50;display:inline-block}
  body.rtl .lang-switch{left:auto;right:16px}
  .lang-switch button{display:block;width:100%;background:var(--pink);color:var(--maroon);border:2px solid var(--pink-dark);border-radius:20px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;line-height:1.4;padding:8px 20px;cursor:pointer;text-align:center}
  .lang-switch button:hover{background:var(--pink-dark)}
  .lang-arrow{display:inline-block;transition:transform .2s ease}
  .lang-switch.open .lang-arrow{transform:rotate(180deg)}
  .lang-menu{display:none;flex-direction:column;gap:8px;margin-top:8px}
  .lang-switch.open .lang-menu{display:flex}
  .lang-switch.open .lang-menu button{animation:langDrop .4s cubic-bezier(.3,1.4,.5,1) both}
  .lang-switch.open .lang-menu button:nth-child(2){animation-delay:.08s}
  @keyframes langDrop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:translateY(0)}}
  .carousel-slide img{-webkit-user-drag:none;user-select:none;pointer-events:none}
  .carousel{cursor:grab}

  /* ---------- Motion + polish ---------- */
  :root{--d:1}
  body.rtl{--d:-1}
  body{-webkit-font-smoothing:antialiased;overflow-x:clip}
  .rv{opacity:0;transform:translateX(calc(var(--dx,64px) * var(--d)));transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1);transition-delay:var(--delay,0ms);will-change:transform,opacity}
  .rv.rv-l{--dx:-64px}
  .rv.rv-r{--dx:64px}
  .rv.in{opacity:1;transform:none}
  .play-card,.contact-section{box-shadow:0 1px 2px rgba(122,59,69,.06),0 10px 30px rgba(122,59,69,.10)}
  .gallery-item{box-shadow:0 1px 2px rgba(122,59,69,.08),0 10px 26px rgba(122,59,69,.14);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease}
  .gallery-item:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(122,59,69,.08),0 16px 34px rgba(122,59,69,.20)}
  .social-btn{box-shadow:0 1px 2px rgba(122,59,69,.06),0 6px 16px rgba(122,59,69,.08)}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  @media (prefers-reduced-motion: reduce){.rv{opacity:1;transform:none;transition:none}}
  .quiz-cta{text-align:center;margin:44px 0 0}
  .quiz-cta .btn-soft{padding:14px 26px;font-size:1.1rem;border-radius:18px;box-shadow:0 8px 20px rgba(244,185,66,.35)}
  .modal-box.wide{max-width:420px;max-height:88vh;overflow-y:auto}
  .modal-box .hint{font-size:.9rem;color:var(--pink-dark);margin-bottom:14px}
  .socials.in-card{margin:0 0 22px;max-width:none;gap:10px}
  .socials.in-card .social-btn{padding:10px 12px;max-width:none}
  .site-footer{margin:70px -20px -80px;padding:40px 20px 34px;background:#FBE3E8;border-top:2px solid var(--pink);border-radius:32px 32px 0 0;box-shadow:0 -10px 30px rgba(122,59,69,.06)}
  .site-footer .socials{margin:0 auto 26px}
  .site-footer .footer-note{font-size:.9rem;color:var(--maroon);opacity:.85}
</style>
</head>

  <script>
    (function () {
      const sw = document.getElementById('langSwitch');
      const btn = document.getElementById('langToggle');
      const btnText = document.getElementById('langToggleText');
      const menu = document.getElementById('langMenu');
      const NAMES = { en: 'English', tr: 'Türkçe', ar: 'العربية' };

      function buildMenu() {
        menu.innerHTML = '';
        ['en', 'tr', 'ar'].filter(function (l) { return l !== window.siteLang; }).forEach(function (l) {
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = l.toUpperCase(); b.setAttribute('aria-label', NAMES[l]);
          b.addEventListener('click', function () {
            applyLanguage(l);
            try { localStorage.setItem('siteLang', l); } catch (e) {}
            sw.classList.remove('open'); btn.setAttribute('aria-expanded', 'false');
          });
          menu.appendChild(b);
        });
      }

      function applyLanguage(lang) {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.body.classList.toggle('rtl', lang === 'ar');

        document.querySelectorAll('[data-en]').forEach(function (el) {
          el.textContent = el.getAttribute('data-' + lang) || el.getAttribute('data-en');
        });
        document.querySelectorAll('[data-en-placeholder]').forEach(function (el) {
          el.placeholder = el.getAttribute('data-' + lang + '-placeholder') || el.getAttribute('data-en-placeholder');
        });

        /* Translated pictures: for photo.png the site looks for photo-ar.png / photo-tr.png
           in the same folder, and keeps the English picture if that file does not exist. */
        document.querySelectorAll('.gallery img, .carousel-slide img').forEach(function (img) {
          if (!img.getAttribute('data-en-src')) img.setAttribute('data-en-src', img.getAttribute('src'));
          const en = img.getAttribute('data-en-src');
          img.onerror = null;
          if (lang === 'en' || !/\.png$/i.test(en)) { img.src = en; return; }
          img.onerror = function () { img.onerror = null; img.src = en; };
          img.src = en.replace(/\.png$/i, '-' + lang + '.png');
        });

        btnText.textContent = lang.toUpperCase();
        window.siteLang = lang;
        buildMenu();
        document.dispatchEvent(new Event('langchange'));
      }

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        const open = sw.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function () { sw.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); });

      let saved = null;
      try { saved = localStorage.getItem('siteLang'); } catch (e) {}
      const bl = (navigator.language || '').toLowerCase();
      const guess = bl.indexOf('ar') === 0 ? 'ar' : bl.indexOf('tr') === 0 ? 'tr' : 'en';
      applyLanguage(NAMES[saved] ? saved : guess);
    })();

    (function () {
      const track = document.getElementById('carTrack');
      const slides = Array.from(track.children);
      const dotsWrap = document.getElementById('carDots');
      const carousel = track.parentElement;
      let current = 0;

      slides.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => goTo(i));
        dotsWrap.appendChild(dot);
      });
      const dots = Array.from(dotsWrap.children);

      function render() {
        const n = slides.length;
        slides.forEach((slide, i) => {
          let offset = i - current;
          if (offset > n / 2) offset -= n;
          if (offset < -n / 2) offset += n;

          const abs = Math.abs(offset);
          let tx = offset * 130;
          let scale = 1 - abs * 0.18;
          let opacity = 1 - abs * 0.35;
          let z = 10 - abs;

          if (abs > 2) { opacity = 0; }

          slide.style.transform = `translate(-50%, -50%) translateX(${tx}px) scale(${scale})`;
          slide.style.opacity = opacity;
          slide.style.zIndex = z;
        });
        dots.forEach((d, i) => d.classList.toggle('active', i === current));
      }

      function goTo(i) {
        const n = slides.length;
        current = ((i % n) + n) % n;
        render();
      }

      /* swipe or drag left / right, like a TikTok photo carousel */
      let startX = 0, dragging = false, moved = false;
      carousel.addEventListener('pointerdown', e => { startX = e.clientX; dragging = true; moved = false; });
      carousel.addEventListener('pointermove', e => { if (dragging && Math.abs(e.clientX - startX) > 10) moved = true; });
      window.addEventListener('pointerup', e => {
        if (!dragging) return;
        dragging = false;
        const dx = e.clientX - startX;
        if (dx > 40) goTo(current - 1);
        else if (dx < -40) goTo(current + 1);
      });
      window.addEventListener('pointercancel', () => { dragging = false; });
      carousel.addEventListener('dragstart', e => e.preventDefault());

      /* tapping a side picture brings it to the middle */
      carousel.addEventListener('click', e => {
        if (moved) return;
        const r = carousel.getBoundingClientRect();
        const x = e.clientX - (r.left + r.width / 2);
        if (Math.abs(x) > 60) goTo(current + (x > 0 ? 1 : -1));
      });

      render();
    })();

    (function () {
      const modal = document.getElementById('planModal');
      const modalTitle = document.getElementById('planModalTitle');
      const modalDesc = document.getElementById('planModalDesc');
      const closeBtn = document.getElementById('planModalClose');
      const badges = document.querySelectorAll('.price-row button.price-badge');

      badges.forEach(badge => {
        badge.addEventListener('click', () => {
          const lg = window.siteLang;
          const title = badge.getAttribute('data-title-' + lg) || badge.getAttribute('data-title');
          const desc = badge.getAttribute('data-desc-' + lg) || badge.getAttribute('data-desc');
          modalTitle.textContent = title;
          modalDesc.textContent = desc;
          modal.classList.add('open');
        });
      });

      function closeModal() {
        modal.classList.remove('open');
      }

      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
    })();
  </script>


  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var L = function () { return window.siteLang || 'en'; };
      var T = function (en, a, t) { var l = L(); return l === 'ar' ? a : (l === 'tr' ? t : en); };
      function confetti() {
        var e = ['🎉','⭐','🌸','✨','💖'];
        for (var i = 0; i < 24; i++) {
          var s = document.createElement('span');
          s.className = 'confetti'; s.textContent = e[i % 5];
          s.style.left = Math.random() * 100 + 'vw';
          s.style.animationDelay = Math.random() * 0.8 + 's';
          document.body.appendChild(s);
          setTimeout(function (x) { x.remove(); }, 3500, s);
        }
      }
      var Q = [
        { q: "What is this? 🍎", a: "ما هذا؟ 🍎", t: "Bu nedir? 🍎", o: ["apple","book","car"], k: 0 },
        { q: "I ___ a student.", a: "أنا ___ تلميذ/ة.", t: "Ben bir öğrenciyim.", o: ["am","is","are"], k: 0 },
        { q: "She ___ two cats.", a: "هي ___ قطتان.", t: "Onun iki kedisi var.", o: ["have","has","haves"], k: 1 },
        { q: "Birds can ___.", a: "الطيور تستطيع أن ___.", t: "Kuşlar uçabilir.", o: ["fly","flies","flying"], k: 0 },
        { q: "He ___ to school every day.", a: "هو ___ إلى المدرسة كل يوم.", t: "O her gün okula gider.", o: ["go","goes","going"], k: 1 },
        { q: "Choose the correct sentence.", a: "اختر الجملة الصحيحة.", t: "Doğru cümleyi seç.", o: ["I have a red big ball.","I have a big red ball.","I have big a red ball."], k: 1 }
      ];
      var LV = [["Starter 🌱","مبتدئ 🌱","Başlangıç 🌱"],["Explorer 🧭","مستكشف 🧭","Kâşif 🧭"],["Star ⭐","نجم ⭐","Yıldız ⭐"]];
      var qi = 0, sc = 0;
      function renderQ() {
        var B = $('qBody');
        if (qi >= Q.length) {
          var lv = sc <= 2 ? 0 : sc <= 4 ? 1 : 2, lvl = LV[lv][0];
          B.innerHTML = '<div class="quiz-step"></div><div class="quiz-result"></div><input type="text" class="quiz-name" id="qName"><button type="button" class="btn-soft" id="qSend"></button><button type="button" class="btn-soft alt" id="qRe"></button>';
          B.children[0].textContent = T('Score: ', 'النتيجة: ', 'Puan: ') + sc + ' / ' + Q.length;
          B.children[1].textContent = T('Level: ', 'المستوى: ', 'Seviye: ') + T(LV[lv][0], LV[lv][1], LV[lv][2]);
          $('qName').placeholder = T("Child's name (optional)", 'اسم الطفل (اختياري)', 'Çocuğun adı (isteğe bağlı)');
          $('qSend').textContent = T('📩 Send result & book a free trial', '📩 أرسل النتيجة واحجز تجربة مجانية', '📩 Sonucu gönder ve ücretsiz deneme iste');
          $('qRe').textContent = T('Try again', 'حاول مرة أخرى', 'Tekrar dene');
          $('qRe').onclick = function () { qi = 0; sc = 0; renderQ(); };
          $('qSend').onclick = function () {
            var n = $('qName').value || '-';
            location.href = 'mailto:mytutor.reach@gmail.com?subject=' + encodeURIComponent('English level result: ' + lvl) +
              '&body=' + encodeURIComponent('Child name: ' + n + '\nScore: ' + sc + ' / ' + Q.length + '\nLevel: ' + lvl + '\nI would like to book a free trial lesson.');
          };
          return;
        }
        var q = Q[qi];
        B.innerHTML = '<div class="quiz-step"></div><div class="quiz-q"></div><div class="quiz-hint"></div>';
        B.children[0].textContent = (qi + 1) + ' / ' + Q.length;
        B.children[1].textContent = q.q;
        B.children[2].textContent = T('', q.a, q.t);
        q.o.forEach(function (o, i) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'quiz-opt'; b.textContent = o;
          b.onclick = function () {
            var all = B.querySelectorAll('.quiz-opt');
            Array.prototype.forEach.call(all, function (x) { x.disabled = true; });
            b.classList.add(i === q.k ? 'right' : 'wrong');
            if (i === q.k) sc++; else all[q.k].classList.add('right');
            setTimeout(function () { qi++; renderQ(); if (qi >= Q.length && sc >= 5) confetti(); }, 900);
          };
          B.appendChild(b);
        });
      }
      var modal = $('quizModal');
      function closeQuiz() { modal.classList.remove('open'); }
      $('quizOpen').onclick = function () { qi = 0; sc = 0; renderQ(); modal.classList.add('open'); };
      $('quizClose').onclick = closeQuiz;
      modal.addEventListener('click', function (e) { if (e.target === modal) closeQuiz(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeQuiz(); });
      document.addEventListener('langchange', renderQ);
      renderQ();
    })();
  </script>


  <script>
    /* Things slide in from the sides as you scroll (mirrored in Arabic) */
    (function () {
      if ((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || !('IntersectionObserver' in window)) return;
      var plan = [];
      function add(sel, side, base, stagger) {
        document.querySelectorAll(sel).forEach(function (el, i) {
          var s = stagger ? (i % 2 === 0 ? 'l' : 'r') : side;
          plan.push([el, s, base + (stagger ? (i % 2) * 110 : 0)]);
        });
      }
      add('h1', 'l', 0);
      add('.subtitle', 'r', 120);
      document.querySelectorAll('.price-row .price-badge').forEach(function (el, i) { plan.push([el, i % 2 === 0 ? 'l' : 'r', 240 + i * 110]); });
      add('.gallery-item', 'l', 0, true);
      add('.carousel-title', 'l', 0);
      add('.carousel', 'r', 120);
      add('.quiz-cta', 'l', 0);
      add('.contact-section', 'l', 0);
      add('.social-btn', 'l', 0, true);
      add('.footer-note', 'r', 0);

      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });

      plan.forEach(function (p) {
        var el = p[0];
        el.classList.add('rv', 'rv-' + p[1]);
        el.style.setProperty('--delay', p[2] + 'ms');
        el.addEventListener('transitionend', function done(ev) {
          if (ev.target !== el || ev.propertyName !== 'transform') return;
          el.classList.remove('rv', 'rv-l', 'rv-r', 'in');
          el.style.removeProperty('--delay');
          el.removeEventListener('transitionend', done);
        });
        io.observe(el);
      });
    })();
  </script>
